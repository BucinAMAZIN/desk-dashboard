<style>body{background:#0d1117;color:#e6edf3;font-family:-apple-system,system-ui,sans-serif;margin:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 30px;max-width:640px;margin:auto}

.big{font-size:36px;font-weight:700}.g{color:#3fb950}.r{color:#f85149}.y{color:#d29922}.m{color:#8b949e;font-size:12px}h2{font-size:14px;color:#8b949e;margin:14px 0 6px}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:6px 4px;border-bottom:1px solid #21262d;vertical-align:top}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
svg{width:100%;height:140px}.chip{display:inline-block;min-width:22px;text-align:center;padding:2px 7px;border-radius:999px;font-size:12px;font-weight:700}
.cW{background:#12361f;color:#3fb950}.cL{background:#3d1517;color:#f85149}.cP{background:#30363d;color:#c9d1d9}.cPending{background:#3a2d0b;color:#d29922}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.bar{height:6px;background:#21262d;border-radius:3px;margin-top:4px;overflow:hidden}.bar>i{display:block;height:100%}
.stats{display:flex;gap:8px}.stats .card{flex:1;text-align:center;padding:10px 4px}.stats b{font-size:20px;display:block}
.leg{border-bottom:1px solid #21262d;padding:8px 0}.leg:last-child{border-bottom:0}.why{margin-top:8px;padding:8px 10px;background:#0d1117;border-radius:8px;font-size:13px;line-height:1.45;color:#c9d1d9}details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}.sb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:10px}.sb .card{min-width:0;overflow:hidden;margin:0;padding:8px 4px;text-align:center}.sb b{display:block;font-size:13px}.tg{display:flex;gap:6px;margin-bottom:8px}.tg div{flex:1;padding:6px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#8b949e;text-align:center;font-size:12px;cursor:pointer}.tg .on{background:#1f6feb33;color:#e6edf3;border-color:#1f6feb}.sc{touch-action:pan-y;cursor:crosshair;display:block;width:100%}.scw{position:relative}.sct{position:absolute;top:-4px;transform:translate(-50%,-100%);background:#161b22;border:1px solid #30363d;border-radius:6px;padding:3px 7px;font-size:12px;white-space:nowrap;pointer-events:none;z-index:3}.sb .card{padding:7px 2px}.sb b{font-size:12px;white-space:nowrap}.sb .m{font-size:10px;white-space:nowrap}.lus{display:block;height:17px;line-height:17px;margin:0 0 6px;padding:0 6px;background:#9e6a03;opacity:1;color:#fff;font-size:10px;font-weight:700;letter-spacing:.3px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}.colh{cursor:pointer;user-select:none}.chv{float:right;margin-left:8px;color:#8b949e;font-size:13px}.cx{display:none!important}</style></head><body>
<div id="hb" class="card" style="margin-bottom:6px;padding:10px 12px"></div><div class="tabs"><div class="tab on" data-k="today">Today</div><div class="tab" data-k="results">Results</div><div class="tab" data-k="record">Our Record</div><div class="tab" data-k="cappers">Cappers</div><div class="tab" data-k="bankroll">Bankroll</div></div>
<div id="sb" class="sb"></div><div id="v"></div><div class="m" id="upd" style="text-align:center;margin-top:8px"></div>
<script>
const UI_BUILD='1792260080';
let D=null,K=location.hash.slice(1)||'today';if(!['today','results','record','cappers','bankroll'].includes(K))K='today';const $=i=>document.getElementById(i),E=s=>String(s??'—').replace(/\bTicket B\b|\+100 ticket/gi,'Parlay +100').replace(/\bSunday NFL (?:anytime )?(?:touchdowns?|TDs?)(?: lotto)?\b/gi,'Touchdown City').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const chip=r=>r==='Pre-lock'?`<span class="chip cPending">⏳ Pending</span>`:`<span class="chip c${['W','L','P','Pending'].includes(r)?r:'P'}">${E(r)}</span>`;
const pc=p=>p==null?'—':p+'%',col=p=>p==null?'#8b949e':p>=55?'#3fb950':p>=45?'#d29922':'#f85149';
const bar=p=>`<div class="bar"><i style="width:${p??0}%;background:${col(p)}"></i></div>`;
const et=t=>new Date(t*1000).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' ET';
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{K=b.dataset.k;history.replaceState(null,'','#'+K);document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));draw()});
function status(s){const c=s=='W'||/won/i.test(s)?'#3fb950':s=='L'||/lost/i.test(s)?'#f85149':'#d29922';return `<span class="dot" style="background:${c}"></span>${E(s=='W'?'Won':s=='L'?'Lost':s)}`}
const gc=g=>({A:'#3fb950',B:'#58a6ff',C:'#d29922',D:'#f0883e',F:'#f85149'})[String(g)[0]]||'#8b949e';const why=w=>`<div class="why">${w?E(w):'<span class=m>Reasoning not logged</span>'}</div>`;

let ALL=sessionStorage.getItem('allsp')=='1';
function spOf(t){t=t||'';if(/\b(NASCAR|GOLF|PGA|LPGA)\b/i.test(t))return'OTHER';if(/\b(NHL|SOG|puck|Lightning|Kraken|Blues|Kings|Penguins)\b/i.test(t))return'NHL';if(/\b(MLB|F5|RBI|Rays|Guardians|innings?|strikeouts?|hits allowed)\b/i.test(t))return'MLB';if(/\bNBA\b/i.test(t))return'NBA';if(/\b(NFL|Rec Yds|Rush Yds|touchdowns?|TDs?)\b/i.test(t))return'NFL';return'';}
function isMaj(t){const s=spOf(t);return s?['MLB','NHL','NBA','NFL'].includes(s):true}
function setAll(v){ALL=v;sessionStorage.setItem('allsp',v?'1':'0');draw()}
function sbub(){const R=D.sport_records||[];return R.map(r=>`<div class="card" style="cursor:pointer;${K=='sport'&&SP==r.sport?'border-color:#1f6feb':''}" onclick="goSport('${E(r.sport)}')"><b>${E(r.sport)}</b><span class=m>${E(r.w)}-${E(r.l)}-${E(r.p)} · ${r.pct==null?'—':r.pct+'%'}</span></div>`).join('')}

let SP='';
function goSport(n){SP=n;K='sport';history.replaceState(null,'','#sport');document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));draw();scrollTo(0,0)}
function fld(){if(SP!='NASCAR')return'';const F=D.nascar_field;if(!F||!(F.rows||[]).length)return'<details class="card"><summary><b>Field data</b> <span class=m>▾</span></summary><div class="m" style="margin-top:6px">Field data not posted yet</div></details>';
 return `<details class="card"><summary><b>Field data</b> <span class=m>${E(F.title)} ▾</span></summary><div style="overflow-x:auto;margin-top:6px"><table><tr>${F.header.map(c=>`<th style="text-align:left" class=m>${E(c)}</th>`).join('')}</tr>${F.rows.map(r=>`<tr>${r.map(c=>`<td style="white-space:nowrap">${E(c)}</td>`).join('')}</tr>`).join('')}</table></div></details>`}
function sport(){const S=((D.today||{}).sports||{})[SP];let h=`<h2>${E(SP)} picks today</h2><div class="m" style="margin-bottom:6px">Unofficial · unstaked · tap a pick for the reasoning</div>`;
 if(!S||(!S.potd&&!S.parlay&&!(S.runners_up||[]).length)){h+=`<div class="card m">${SP=='GOLF'?'No PGA Tour event this week':'No picks today'}</div><div class="card m">Play of the Day: —</div><div class="card m">Parlay +100: —</div><h2>Runners-up (next-best plays)</h2><div class="card m">No runners-up today</div>`;return h+fld()}
 const lg=l=>`<details class="leg"><summary><div class="row"><div>${E(l.pick)}<div class=m>${E(l.game)}</div></div><div style="text-align:right;white-space:nowrap">${E(l.odds)} ${chip(l.status)}<div class=m>Why ▾</div></div></div></summary>${why(l.why)}</details>`;
 h+=S.potd?`<details class="card"><summary><div class="m">Play of the Day</div><div class="big" style="font-size:24px">${E(S.potd.pick)}</div><div class="m">${E(S.potd.game)}</div><div class="row" style="margin-top:8px"><div>${chip(S.potd.status)}</div><div class="m">Odds <b style="color:#e6edf3">${E(S.potd.odds)}</b> · Why ▾</div></div></summary>${why(S.potd.why)}</details>`:'<div class="card m">No POTD today</div>';
 h+=S.parlay?`<div class="card"><div class="m">Parlay +100</div><div class="big" style="font-size:30px">${E(S.parlay.odds)}</div>${chip(S.parlay.status)}${S.parlay.why?why(S.parlay.why):''}<div style="margin-top:8px">${(S.parlay.legs||[]).map(lg).join('')}</div></div>`:'<div class="card m">No parlay today</div>';
 const R=S.runners_up||[];h+='<h2>Runners-up (next-best plays)</h2>';
 h+=R.length?'<div class="card">'+R.map(x=>`<details class="leg"><summary><div class="row"><div><span class="chip cP">${x.rank}</span> ${x.grade&&x.grade!='—'?`<span class="chip" style="background:${gc(x.grade)}22;color:${gc(x.grade)};border:1px solid ${gc(x.grade)}66">${E(x.grade)}</span> `:''}${E(x.pick)}<div class=m>${E(x.game)}</div></div><div style="text-align:right;white-space:nowrap"><b>${E(x.odds)}</b> ${chip(x.status)}<div class=m>Why ▾</div></div></div></summary>${why(x.why)}</details>`).join('')+'</div>':'<div class="card m">No runners-up today</div>';
 return h+fld()}
function today(){const t=D.today;const RS={};((D.runners_up_record||{}).recent||[]).forEach(x=>{if(x.date==D.capper_today_date)RS[x.rank]=x.sport});let h=`<div class="tg"><div class="${ALL?'':'on'}" onclick="setAll(false)">Majors</div><div class="${ALL?'on':''}" onclick="setAll(true)">All sports</div></div>`+`<div class="m" style="margin-bottom:6px">${E(t.title)} · tap a pick for the reasoning</div>`;
 if(!ALL&&!t.tickets.length)h+='<div class="card m">No picks posted yet. Picks drop around noon ET.</div>';
 const AS=((t.sports||{}).ALL);if(ALL){h+='<div class="m" style="margin-bottom:6px">All-sports picks · unofficial · unstaked</div>';if(!AS||(!AS.potd&&!AS.parlay))h+='<div class="card m">No all-sports picks today</div>';else{if(AS.potd)h+=`<details class="card"><summary><div class="m">Play of the Day (All Sports)</div><div class="big" style="font-size:24px">${E(AS.potd.pick)}</div><div class="m">${E(AS.potd.game)}</div><div class="row" style="margin-top:8px"><div>${chip(AS.potd.status)}</div><div class="m">Odds <b style="color:#e6edf3">${E(AS.potd.odds)}</b> · Why ▾</div></div></summary>${why(AS.potd.why)}</details>`;if(AS.parlay)h+=`<div class="card"><div class="m">Parlay +100 (All Sports)</div><div class="big" style="font-size:30px">${E(AS.parlay.odds)}</div>${chip(AS.parlay.status)}<div style="margin-top:8px">${(AS.parlay.legs||[]).map(l=>`<details class="leg"><summary><div class="row"><div>${E(l.pick)}<div class=m>${E(l.game)}</div></div><div style="text-align:right;white-space:nowrap">${E(l.odds)} ${chip(l.status)}<div class=m>Why ▾</div></div></div></summary>${why(l.why)}</details>`).join('')}</div></div>`}}
 for(const k of (ALL?[]:t.tickets)){if(!ALL&&!(k.legs.length?k.legs.some(l=>isMaj(l.pick+' '+l.game)):isMaj(k.pick+' '+k.game+' '+(k.why||''))))continue;const head=`<div class="m">${E(k.name=='POTD'?'Play of the Day':k.name)}</div>
 <div class="big" style="font-size:${k.legs.length?30:24}px">${E(k.legs.length?k.odds:k.pick)}</div>
 ${k.legs.length?'':`<div class="m">${E(k.game)}</div>`}
 <div class="row" style="margin-top:8px"><div>${status(k.status)}</div><div class="m">${k.legs.length?'':'Odds <b style="color:#e6edf3">'+E(k.odds)+'</b> · '}Stake <b style="color:#e6edf3">${E(k.stake)}</b> · Pays <b class="g">${E(k.payout)}</b></div></div>`;
  if(!k.legs.length){h+=`<details class="card"><summary>${head}<div class="m" style="text-align:right">Why ▾</div></summary>${why(k.why)}</details>`;continue}
  h+=`<div class="card">${head}${k.why?why(k.why):''}<div style="margin-top:8px">`+k.legs.map(l=>`<details class="leg"><summary><div class="row"><div>${E(l.pick)}<div class=m>${E(l.game)}</div></div><div style="text-align:right;white-space:nowrap">${E(l.odds)} ${chip(l.status)}<div class=m>Why ▾</div></div></div></summary>${why(l.why)}</details>`).join('')+'</div></div>'}
 const r=(t.runners_up||[]).filter(x=>ALL||(RS[x.rank]?['MLB','NHL','NBA','NFL'].includes(RS[x.rank]):isMaj(x.pick+' '+x.game)));
 h+='<h2>Runners-up (backups if a leg is lost)</h2>';
 h+=r.length?'<div class="card">'+r.map(x=>`<details class="leg"><summary><div class="row"><div><span class="chip cP">${x.rank}</span> ${x.grade&&x.grade!='—'?`<span class="chip" style="background:${gc(x.grade)}22;color:${gc(x.grade)};border:1px solid ${gc(x.grade)}66">${E(x.grade)}</span> `:''}${E(x.pick)}<div class=m>${E(x.game)}</div></div><div style="text-align:right;white-space:nowrap"><b>${E(x.odds)}</b> ${x.status?chip(x.status):''}<div class=m>Why ▾</div></div></div></summary>${x.stat&&x.stat!='—'?`<div class="m" style="margin-top:6px">Result: ${E(x.stat)}</div>`:''}${why(x.why)}</details>`).join('')+'</div>':'<div class="card m">No runners-up logged yet.</div>';

 if(ALL){const n=t.ncaaf||[],NR=(D.ncaaf_record||{}).overall||{};
 h+=`<h2 style="margin-top:22px;border-top:1px solid #30363d;padding-top:14px">🏈 College Football <span class="m" style="font-weight:400">· separate record ${E(NR.w)}-${E(NR.l)}${NR.p?'-'+NR.p:''}</span></h2>`;
 h+=n.length?n.map(x=>`<details class="card" style="border-color:#6e40c9"><summary><div class="row"><div><span class="chip cP">${x.rank||''}</span> ${x.grade&&x.grade!='—'?`<span class="chip" style="background:${gc(x.grade)}22;color:${gc(x.grade)};border:1px solid ${gc(x.grade)}66">${E(x.grade)}</span> `:''}<b>${E(x.pick)}</b><div class=m>${E(x.game)}</div></div><div style="text-align:right;white-space:nowrap"><b>${E(x.odds)}</b> ${chip(x.status)}<div class=m>Why ▾</div></div></div></summary>${x.stat&&x.stat!='—'?`<div class="m" style="margin-top:6px">Result: ${E(x.stat)}</div>`:''}${why(x.why)}</details>`).join(''):'<div class="card m">No College Football plays posted today.</div>';}
 return h}
function results(){const r=D.results;let h='<h2>Recent tickets</h2>';
 h+=r.tickets.map(t=>`<div class="card"><div class="row"><div><b>${E(t.name)}</b> <span class="m">${E(t.date)}</span><div class=m>${E(t.desc)}</div></div>${chip(t.result)}</div>
 <table style="margin-top:6px">${t.legs.map(l=>`<tr><td>${E(l.pick)}<div class=m>${E(l.stat)} · ${E(l.final)}</div></td><td style="text-align:right">${chip(l.result)}</td></tr>`).join('')}</table></div>`).join('')||'<div class="card m">None yet</div>';
 h+='<h2>Nightly</h2><div class="card"><table>'+r.nights.map(n=>`<tr><td class=m>${E(n.date)}</td><td>${E(n.text)}</td></tr>`).join('')+'</table></div>';
 return h}
function record(){const o=D.record.overall,L=o.legs||{},T=o.tickets||{},P=o.potd||{};
 let h=`<div class="card"><div class="m">All graded legs since Oct 12</div><div class="big ${L.pct>=50?'g':'r'}">${E(L.w)}-${E(L.l)}</div><div>${pc(L.pct)} hit rate</div>
 <div class="m" style="margin-top:4px">Placed legs: ${E((o.placed_legs||{}).w)}-${E((o.placed_legs||{}).l)} (${pc((o.placed_legs||{}).pct)})</div></div>
 <div class="stats"><div class="card"><span class=m>Tickets</span><b>${E(T.w)}-${E(T.l)}</b><span class=m>${pc(T.pct)}</span></div><div class="card"><span class=m>POTD</span><b>${E(P.w)}-${E(P.l)}${P.p?'-'+P.p:''}</b><span class=m>${pc(P.pct)}</span></div></div>`;
 const c=D.record.chart||[];if(c.length>1){const v=c.map(x=>x[1]),lo=Math.min(0,...v),hi=Math.max(0,...v),rg=hi-lo||1,Y=y=>(130-(y-lo)/rg*120).toFixed(1),X=i=>(i*300/(v.length-1)).toFixed(1),last=v[v.length-1];
  h+=`<div class="card"><div class="row"><span class=m>Net wins (W−L), placed legs + POTD from Oct 13</span><b class="${last>=0?'g':'r'}">${last>=0?'+':''}${last}</b></div><svg class="sc" data-sc="${encodeURIComponent(JSON.stringify((()=>{let w=0,l=0,pv=0;const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return v.map((y,i)=>{if(y>pv)w++;else l++;pv=y;const d=String(c[i][0]).split("/");return [+X(i),+Y(y),(d.length==2?M[+d[0]-1]+" "+(+d[1]):c[i][0])+" · "+w+"-"+l+" ("+(y>=0?"+":"")+y+")"]})})()))}" viewBox="0 0 300 140" preserveAspectRatio="none"><line x1="0" x2="300" y1="${Y(0)}" y2="${Y(0)}" stroke="#30363d" stroke-dasharray="4 4"/><polyline fill="none" stroke="${last>=0?'#3fb950':'#f85149'}" stroke-width="2" points="${v.map((y,i)=>X(i)+','+Y(y)).join(' ')}"/></svg><div class="row m"><span>${E(c[0][0])}</span><span>${E(c[c.length-1][0])}</span></div></div>`}
 h+='<h2>By prop type</h2><div class="card">'+D.record.props.map(p=>`<div style="margin:8px 0"><div class="row"><span>${E(p.prop)}</span><span><b>${E(p.w)}-${E(p.l)}</b> <span class=m>${pc(p.pct)}</span></span></div>${bar(p.pct)}</div>`).join('')+'</div>';
 h+='<h2>Play of the Day log</h2><div class="card"><table>'+D.record.potd.map(p=>`<tr><td class=m>${E(p.date)}</td><td>${E(p.pick)}<div class=m>${E(p.odds)} · ${E(p.detail)}</div></td><td style="text-align:right">${chip(p.result)}</td></tr>`).join('')+'</table></div>';
 {const R=D.runners_up_record||{},O=R.overall||{};
 h+=`<h2 style="margin-top:22px;border-top:1px dashed #30363d;padding-top:14px">Runners-up (unofficial · not in our record)</h2>
 <div class="card" style="border-style:dashed"><div class="m">Backup plays, graded separately</div><div class="row"><div class="big" style="font-size:28px">${E(O.w)}-${E(O.l)}${O.p?'-'+O.p:''}</div><div style="color:${col(O.pct)}">${pc(O.pct)}</div></div>${bar(O.pct)}</div>`;
 h+='<div class="card" style="border-style:dashed"><div class=m>By prop type</div>'+((R.props||[]).map(p=>`<div style="margin:8px 0"><div class="row"><span>${E(p.prop)}</span><span><b>${E(p.w)}-${E(p.l)}${p.p?'-'+p.p:''}</b> <span class=m>${pc(p.pct)}</span></span></div>${bar(p.pct)}</div>`).join('')||'<div class="m" style="margin-top:6px">No graded runners-up yet</div>')+'</div>';
