<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Open in DraftKings</title>
<style>body{margin:0;background:#0d1117;color:#c9d1d9;font:15px/1.45 -apple-system,system-ui,sans-serif;padding:20px;max-width:560px}h1{font-size:18px;margin:0 0 10px}#go{display:none;margin:14px 0;padding:12px 14px;border-radius:10px;background:#53d337;color:#0d1117;font-weight:700;text-decoration:none;text-align:center}.m{color:#8b949e;font-size:13px}ul{padding-left:18px}a.b{color:#58a6ff}</style></head><body>
<!-- dkmulti1104 (user 2026-11-04 7:09 PM ET via dr eggbot; DISPLAY/LINK ONLY, no login, no bets).
     Opens the DraftKings app slip with several picks: dksb://sb/addbet/<id>+<id> (phone-tested 7:09 PM ET).
     Not an open redirect: the target is always the fixed dksb://sb/addbet/ scheme, and every id must be a DK Predictions
     selection id that is on today's board (dk_sid in ./data.json). Unknown ids are dropped and listed. -->
<h1>Open in DraftKings</h1>
<div id="st" class="m">Checking picks against today's board…</div>
<a id="go" href="#">Tap here to open DraftKings</a>
<ul id="legs"></ul>
<p class="m">DK slip keeps earlier picks, so clear it first.</p>
<p class="m"><a class="b" href="./">Back to the board</a></p>
<script>
(function(){
 var st=document.getElementById('st'),go=document.getElementById('go'),ul=document.getElementById('legs');
 function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
 var raw=new URLSearchParams(location.search).get('ids')||'';
 var want=raw.split(/[\s,+]+/).filter(Boolean).filter(function(x,i,a){return a.indexOf(x)==i}).slice(0,25);
 if(!want.length){st.textContent='No picks in this link.';return}
 fetch('data.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
  var ok={},m,rx=/"dk_sid":\s*"(0QA[0-9A-Za-z#_\-]+)"/g,lab={};
  while((m=rx.exec(t)))ok[m[1]]=1;
  try{(function walk(o){if(o&&typeof o=='object'){if(o.dk_sid&&!lab[o.dk_sid])lab[o.dk_sid]=o.pick||o.leg||((o.player||'')+' '+(o.prop||'')).trim()||o.dk_pick||'';for(var k in o)walk(o[k])}})(JSON.parse(t))}catch(e){}
  var good=want.filter(function(x){return /^0QA[0-9A-Za-z#_\-]+$/.test(x)&&ok[x]}),bad=want.filter(function(x){return good.indexOf(x)<0});
  ul.innerHTML=good.map(function(x){return '<li>'+esc(lab[x]||x)+'</li>'}).join('')+bad.map(function(x){return '<li class="m">Skipped (not on today\'s board): '+esc(x.slice(0,40))+'</li>'}).join('');
  if(!good.length){st.textContent='None of these picks are on today\'s DraftKings board any more.';return}
  var u='dksb://sb/addbet/'+good.map(encodeURIComponent).join('+');
  go.href=u;go.style.display='block';
  st.textContent='Opening DraftKings with '+good.length+' pick'+(good.length>1?'s':'')+'. If nothing happens, tap the button.'+(good.length>6?' DK Combos take up to 6 picks.':'');
  setTimeout(function(){location.href=u},300);
 }).catch(function(){st.textContent='Could not load today\'s board, so nothing was opened. Reload to try again.'});
})();
</script></body></html>
